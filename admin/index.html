<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders · Super Al-Amin staff</title>
  <meta name="theme-color" content="#1d4a34">
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../styles.css?v=20261114g">
  <link rel="stylesheet" href="admin.css?v=20261114g">
</head>
<body class="admin-body">
  <header class="adm-top">
    <div class="adm-wrap adm-top-inner">
      <a class="adm-brand" href="../"><img src="../images/logo.png" alt="" width="36" height="36"><span>Orders</span></a>
      <div class="adm-top-actions" id="adm-top-actions" hidden>
        <button type="button" class="adm-icon-btn" id="adm-refresh" aria-label="Refresh orders">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
        </button>
        <button type="button" class="adm-text-btn" id="adm-lock">Lock</button>
      </div>
    </div>
  </header>

  <main class="adm-wrap" id="main">
    <!-- Sign in -->
    <section class="adm-login" id="adm-login">
      <h1>Staff order page</h1>
      <p>Enter the store passcode to see orders.</p>
      <form id="adm-login-form" novalidate>
        <label class="order-field">Passcode<input id="adm-pass" type="password" autocomplete="current-password" required></label>
        <label class="adm-check"><input type="checkbox" id="adm-remember"> Keep me signed in on this device</label>
        <button class="btn btn-primary adm-login-btn" type="submit">Sign in</button>
        <p class="adm-error" id="adm-login-error" role="alert" hidden></p>
      </form>
      <p class="adm-fine">Orders still arrive by email, WhatsApp, and text as usual. This page is an extra.</p>
    </section>

    <!-- Orders -->
    <section id="adm-app" hidden>
      <div class="adm-tabs" role="tablist" id="adm-tabs"></div>
      <p class="adm-status-line" id="adm-status-line" aria-live="polite"></p>
      <div class="adm-new" id="adm-new" hidden></div>
      <ul class="adm-list" id="adm-list"></ul>
      <p class="adm-empty" id="adm-empty" hidden></p>
    </section>
  </main>

  <!-- Message sheet -->
  <div class="adm-sheet-bg" id="adm-sheet-bg" hidden></div>
  <div class="adm-sheet" id="adm-sheet" role="dialog" aria-modal="true" aria-labelledby="adm-sheet-title" hidden>
    <div class="adm-sheet-head">
      <h2 id="adm-sheet-title">Update order</h2>
      <button type="button" class="adm-icon-btn" id="adm-sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="adm-sheet-sub" id="adm-sheet-sub"></p>
    <label class="order-field" id="adm-total-wrap">Final total (after weighing)
      <span class="adm-money"><span>$</span><input id="adm-total" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></span>
    </label>
    <label class="order-field" id="adm-msg-wrap">Message to customer (you can edit it)
      <textarea id="adm-msg" rows="5"></textarea>
    </label>
    <div class="adm-sheet-btns">
      <button type="button" class="btn btn-whatsapp" id="adm-send-wa">Save &amp; send on WhatsApp</button>
      <button type="button" class="btn btn-primary" id="adm-send-sms">Save &amp; send by text</button>
      <button type="button" class="btn btn-outline" id="adm-save-only">Save without a message</button>
    </div>
    <p class="adm-error" id="adm-sheet-error" role="alert" hidden></p>
  </div>

  <div class="order-toast" id="adm-toast" role="status" aria-live="polite"></div>

  <script src="../site-config.js?v=20261114g"></script>
  <script src="../meat-menu.js?v=20261114g"></script>
  <script src="admin.js?v=20261114g"></script>
</body>
</html>
